name: Verify Vercel deployment branch

on:
  push:
    branches:
      - feature/vercel-deployment
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "backend/**"
      - "frontend/**"
      - "linkedin-crm-extension/**"
      - "vercel.json"
      - "package.json"

jobs:
  build-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check backend/auth.js
          node --check "api/[...path].js"
          node --check linkedin-crm-extension/background.js
